[project]
name = "admin-assistant"
version = "0.1.0"
description = "Admin Assistant Project"
authors = [
    {name = "Vasyl Radashev",email = "vasiliyradashev24@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.121.1,<0.122.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.44,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "motor (>=3.7.1,<4.0.0)",
    "alembic (>=1.17.1,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "aiogram (>=3.22.0,<4.0.0)",
    "deep-translator (>=1.11.4,<2.0.0)",
    "vosk (>=0.3.45,<0.4.0)",
    "soundfile (>=0.13.1,<0.14.0)",
    "ffmpeg (>=1.4,<2.0)",
    "langdetect (>=1.0.9,<2.0.0)",
    "apscheduler (>=3.11.1,<4.0.0)",
    "google-api-python-client (>=2.187.0,<3.0.0)",
    "google-auth-httplib2 (>=0.2.1,<0.3.0)",
    "google-auth-oauthlib (>=1.2.3,<2.0.0)",
    "gtts (>=2.5.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pre-commit = "^4.4.0"
black = "^25.9.0"
isort = "^7.0.0"
flake8 = "^7.3.0"
ruff = "^0.14.4"
mypy = "^1.18.2"
httpx = "^0.28.1"
pytest-asyncio = "^1.3.0"

[tool.poetry]
packages = [{ include = "app" }]

[project.scripts]
dev = "uvicorn:main"


[tool.black]
line-length = 100
target-version = ['py311']
extend-exclude = '''
/(
    migrations
)/
'''


[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations"]
